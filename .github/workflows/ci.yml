name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Verify Python Syntax Across All Files
      run: |
        echo "Compiling and checking syntax of all Python files..."
        python -m compileall -q .
        echo "All Python files passed syntax verification!"
